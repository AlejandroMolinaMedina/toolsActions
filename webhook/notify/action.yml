name: 'Dynamic Webhook Sender'
description: 'Envía cualquier JSON a cualquier endpoint'

inputs:
  endpoint:
    description: 'URL del webhook'
    required: true
  json_body:
    description: 'El objeto JSON completo en formato string'
    required: true
  track_usage:
    description: 'Registrar la ejecución en el contador público de uso (true/false)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Registrar uso
      if: inputs.track_usage == 'true'
      shell: bash
      run: curl -fsS -m 5 -o /dev/null "https://counter.driagonattack.com/hit/webhook-notify" || true

    - name: Send Payload
      shell: bash
      env:
        # Al pasarlo por env, evitamos problemas de escape de comillas en bash
        PAYLOAD: ${{ inputs.json_body }}
      run: |
        curl --location '${{ inputs.endpoint }}' \
        --header 'Content-Type: application/json' \
        --data "$PAYLOAD"
